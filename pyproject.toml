[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "prek==0.3.9",
  "pyright==1.1.405",
  "ruff==0.13.0",
  "toml-sort==0.23.1"
]
tests = [
  "beartype",
  "jaxlib",
  "matplotlib",
  "pytest",
  "python-flint",
  "scipy"
]

[project]
authors = [
  {name = "Kirill Terskii"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics"
]
# diffrax._term.WrapTerm is private, hence the upper bound.
dependencies = ["diffrax>=0.7,<0.8", "equinox>=0.11.10", "jax>=0.4.38", "jaxtyping>=0.2.24", "numpy"]
description = "Exact solvers for differential equations over the p-adic numbers and on finite groups, in JAX: p-adic flows, return sets, formal groups and Chabauty, invertible p-adic layers, ultrametric diffusion."
keywords = ["jax", "p-adic", "dynamical-systems", "differential-equations", "number-theory", "finite-groups", "formal-groups", "chabauty", "diffrax"]
license = {file = "LICENSE"}
name = "galrax"
optional-dependencies = {abs = ["python-flint"], plot = ["matplotlib"]}
readme = "README.md"
requires-python = ">=3.11"
urls = {issues = "https://github.com/NotTruecCoder/galrax/issues", repository = "https://github.com/NotTruecCoder/galrax"}
version = "0.2.0"

[project.scripts]
galrax-abs = "galrax.padic.cli:main"

[tool.hatch.build]
include = ["galrax/*", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["galrax"]

[tool.pyright]
include = ["galrax", "test"]
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = false # Incompatible with eqx.AbstractVar
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=galrax,beartype.beartype(conf=beartype.BeartypeConf(strategy=beartype.BeartypeStrategy.On))"
markers = ["slow"]

[tool.ruff]
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"collections" = "co"
"functools" = "ft"
"itertools" = "it"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.uv]
default-groups = ["dev", "tests"]
